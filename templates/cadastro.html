{% extends 'base.html' %}

{% block content %}
<div class="auth-wrapper" style="margin-top: 2rem; margin-bottom: 2rem;">
    <div class="auth-card large">
        <h2>Criar Nova Conta</h2>
        <form method="POST">
            <h3 style="margin-bottom: 1rem; color: var(--text-muted); border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Dados Pessoais</h3>
            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label class="form-label" for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" class="form-control" required placeholder="000.000.000-00">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="nascimento">Data de Nascimento</label>
                    <input type="date" id="nascimento" name="nascimento" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="sexo">Sexo</label>
                    <select id="sexo" name="sexo" class="form-control" required>
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="contato">Telefone / Contato</label>
                    <input type="text" id="contato" name="contato" class="form-control" required>
                </div>
            </div>

            <h3 style="margin-bottom: 1rem; margin-top: 2rem; color: var(--text-muted); border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Endereço</h3>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="estado">Estado (UF)</label>
                    <input type="text" id="estado" name="estado" class="form-control" maxlength="2" required placeholder="SP">
                </div>
                <div class="form-group" style="flex: 2;">
                    <label class="form-label" for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" class="form-control" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="bairro">Bairro</label>
                    <input type="text" id="bairro" name="bairro" class="form-control" required>
                </div>
                <div class="form-group" style="flex: 2;">
                    <label class="form-label" for="rua">Rua</label>
                    <input type="text" id="rua" name="rua" class="form-control" required>
                </div>
            </div>

            <h3 style="margin-bottom: 1rem; margin-top: 2rem; color: var(--text-muted); border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">Credenciais de Acesso</h3>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="email">E-mail</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" class="form-control" required>
                </div>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1.5rem; font-size: 1.1rem; padding: 1rem;">Finalizar Cadastro</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted);">
            Já tem uma conta? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600;">Faça login</a>
        </p>
    </div>
</div>
{% endblock %}
