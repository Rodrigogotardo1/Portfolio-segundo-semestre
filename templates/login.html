{% extends 'base.html' %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Entrar no Sistema</h2>
        <form method="POST">
            <div class="form-group">
                <label class="form-label" for="email">E-mail</label>
                <input type="email" id="email" name="email" class="form-control" required placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label class="form-label" for="senha">Senha</label>
                <input type="password" id="senha" name="senha" class="form-control" required placeholder="Sua senha secreta">
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Acessar Minha Conta</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted);">
            Não tem uma conta? <a href="{{ url_for('cadastro') }}" style="color: var(--primary); font-weight: 600;">Cadastre-se</a>
        </p>
    </div>
</div>
{% endblock %}
